name: Discover locations

on:
  # El cron no corre al hacer push. Este paths lo lanza al subir el propio workflow
  # o el script. El commit del bot solo toca public/*.json, así que no se reengancha.
  push:
    branches: [main]
    paths:
      - .github/workflows/discover.yml
      - scripts/**
      - src/data/seeds.json
      - src/data/landmarkPins.json
  schedule:
    # Cada 5 horas en punto (UTC). GitHub puede retrasar el cron en repos públicos.
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: discover-locations
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sanity-check data contract
        run: node scripts/validate-data.mjs

      # El script NO toca discovered.json si la lista no cambió: sin commits
      # ni deploys vacíos cada 5 horas.
      - name: Fetch new gtadb and IGN Leonida locations
        run: |
          set -o pipefail
          node scripts/discover-locations.mjs | tee discovery-summary.md
          cat discovery-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Bandeja de propuestas: issues con label pin-suggestion → suggestions.json.
      # Sigue con archivo previo si el API de GitHub falla; no bloquea el descubrimiento.
      - name: Refresh community suggestions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-suggestions.mjs

      - name: Commit published feeds
        id: commit
        run: |
          git add public/discovered.json public/suggestions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update published map feeds"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push con GITHUB_TOKEN no dispara el workflow de Pages. Hay que lanzarlo a mano.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
